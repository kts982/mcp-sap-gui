[build-system]
# Exact pin: build backends are not covered by uv.lock, so an unpinned
# hatchling would let release builds execute a freshly published backend.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-sap-gui"
version = "0.3.0"
description = "MCP Server for SAP GUI Scripting automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "mcp-sap-gui contributors" }
]
keywords = ["mcp", "sap", "gui", "automation", "scripting", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # FastMCP permits breaking changes in minor releases; patches are safe.
    # Ceiling bumps (3.5, 3.6, ...) are deliberate, validated steps.
    "fastmcp>=3.4.7,<3.5",
    "pywin32>=306; platform_system == 'Windows'",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
screenshots = [
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]
code-mode = [
    "fastmcp[code-mode]>=3.4.7,<3.5",
]
apps = [
    "fastmcp[apps]>=3.4.7,<3.5",
    # prefab-ui docs warn of frequent breaking changes - pin exact (like monty in code-mode)
    "prefab-ui==0.20.2",
]

[project.scripts]
mcp-sap-gui = "mcp_sap_gui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sap_gui"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_sap_gui/prompts.py" = ["E501"]  # prompt text is long-form markdown
"tests/test_sap_controller.py" = ["N802"]  # COM-API fakes mirror SAP GUI naming

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
